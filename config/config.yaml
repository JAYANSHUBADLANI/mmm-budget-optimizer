# Central configuration. Every module reads from here rather than hardcoding values,
# so a reviewer can change an assumption in one place and rerun the pipeline.

project:
  name: mmm-budget-optimizer
  random_seed: 42

paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  external: data/external
  models: models
  figures: reports/figures
  tables: reports/tables

data:
  # Primary dataset. Kaggle slug and the file it ships.
  primary:
    kaggle_slug: yugagrawal95/sample-media-spends-data
    filename: sample_media_spend.csv
    expected_rows: 3051
    expected_divisions: 26
    expected_weeks: 113
    date_col: Calendar_Week
    entity_col: Division
    target_col: Sales
    date_format: "%m/%d/%Y"
  # Secondary dataset, generalisation check only. Never merged with the primary.
  secondary:
    kaggle_slug: singhnavjot2062001/product-advertising-data
    filename: Advertising_Data.csv
    target_col: Product_Sold
  # Benchmark dataset, correctness check only. Never merged with the primary.
  benchmark:
    source_url: https://github.com/facebookexperimental/Robyn/raw/main/R/data/dt_simulated_weekly.RData
    filename: dt_simulated_weekly.RData
    object_name: dt_simulated_weekly
    date_col: DATE
    target_col: revenue

channels:
  # Media channels I treat as controllable budget levers.
  # Every one of these is an impression or view count, not currency. See cpm below.
  paid:
    - Google_Impressions
    - Facebook_Impressions
    - Email_Impressions
    - Affiliate_Impressions
    - Paid_Views
  # Not a budget lever. Organic volume is an outcome of brand and content, not a line
  # item I can reallocate, so it enters the model as a control, not as a spend channel.
  organic_controls:
    - Organic_Views
  # Suspected derived column. src/mmm/validation.py tests whether
  # Overall_Views equals Paid_Views + Organic_Views and drops it if so, because a
  # perfectly collinear aggregate would leak the components into the design matrix.
  suspected_derived:
    - Overall_Views

# Assumed cost per thousand impressions, in the currency of the Sales column.
# IMPORTANT: the dataset ships impressions and views, not spend. Nothing in the source
# data tells me what any of this cost. These rates are my own stated assumptions, used
# only to express model output in budget terms. Every currency figure downstream inherits
# this assumption. See docs/cpm_assumptions.md for the reasoning behind each number.
cpm:
  Google_Impressions:
    value: 52.50
    basis: "Search. Assumed CPC 1.50 at CTR 3.5 percent, so cost per impression 0.0525."
  Facebook_Impressions:
    value: 7.20
    basis: "Paid social feed placement, mid range of published 2018 to 2020 benchmarks."
  Email_Impressions:
    value: 1.50
    basis: "Owned channel. Cost is ESP send cost plus creative, roughly 0.0015 per delivery."
  Affiliate_Impressions:
    value: 4.00
    basis: "Performance channel priced on CPA. Converted to an effective CPM at assumed conversion rates."
  Paid_Views:
    value: 25.00
    basis: "Video. Assumed CPV 0.025, expressed per thousand views for consistency."
  Organic_Views:
    value: 0.00
    basis: "No incremental media cost. Excluded from the optimiser budget."

features:
  adstock:
    # Geometric decay. I bound the retention rate away from 1 so the carryover
    # cannot become an unidentified random walk.
    max_lag: 8
    decay_lower: 0.0
    decay_upper: 0.9
  saturation:
    # Hill curve. half_sat is expressed on the scaled input, slope controls the S shape.
    slope_lower: 0.5
    slope_upper: 3.0
  seasonality:
    fourier_order: 3
    period_weeks: 52.18

model:
  bayesian:
    draws: 1000
    tune: 1000
    chains: 4
    target_accept: 0.9
    cores: 4
    # Fast configuration used by tests and by the smoke run. Never quote results from this.
    smoke:
      draws: 50
      tune: 50
      chains: 2
      target_accept: 0.8
      cores: 2
  linear:
    # Ridge penalty grid for the comparison model. Media regressors are collinear,
    # so plain OLS is unstable and I want that instability to be visible, not hidden.
    alphas: [0.0, 0.01, 0.1, 1.0, 10.0, 100.0]
    fit_ols_too: true

backtest:
  holdout_weeks: 13
  n_folds: 3
  step_weeks: 4
  metrics: [mape, smape, rmse, r2]

causal:
  # Divisions held out entirely, to test whether the model recovers effects in geos it
  # never saw. Chosen by spend volatility rank inside src/mmm/causal.py, not by hand.
  n_holdout_divisions: 5
  did:
    # Difference in differences on a spend shock: treated divisions are those with a
    # large step change in a channel, controls are matched on pre period sales trend.
    shock_threshold_sd: 1.5
    pre_weeks: 12
    post_weeks: 12
    min_treated: 3

optimizer:
  # Constraints in the reallocation problem. These are the difference between a
  # defensible recommendation and an unusable corner solution.
  total_budget_source: observed          # observed | manual
  manual_total_budget: null
  min_spend_pct_of_current: 0.60         # no channel can fall below 60 percent of current
  max_spend_pct_of_current: 1.60         # no channel can rise above 160 percent of current
  max_total_reallocation_pct: 0.25       # at most 25 percent of total budget may move
  method: SLSQP
  n_restarts: 12
  uncertainty:
    # Reoptimise across posterior draws to get an interval on the uplift, rather than
    # quoting a single point estimate the business will treat as a promise.
    n_posterior_draws: 200

enrichment:
  holidays:
    enabled: true
    country: US
    years: [2018, 2019, 2020]
  google_trends:
    enabled: true
    keyword: "online shopping"
    geo: US
    timeframe: "2018-01-01 2020-03-01"
    cache_file: google_trends.csv
  fred:
    enabled: true
    series_id: CPIAUCSL
    cache_file: fred_cpi.csv

reporting:
  currency_symbol: "$"
  round_dp: 2
