# Full stack: dashboard, Airflow, and a one shot pipeline runner.
#
#   docker compose up app                 dashboard only, the fast path
#   docker compose --profile pipeline up  adds Airflow and the dbt layer
#   docker compose run --rm pipeline      runs phases 1 to 3 once and exits
#
# I default to the dashboard alone because that is what a reviewer wants first. Standing up
# a scheduler to look at a chart is friction with no payoff.

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: mmm-budget-optimizer:latest
    container_name: mmm-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/opt/project/data
      - ./models:/opt/project/models
      - ./reports:/opt/project/reports
    environment:
      - MMM_PROJECT_ROOT=/opt/project
    env_file:
      - path: .env
        required: false

  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    image: mmm-budget-optimizer:latest
    container_name: mmm-pipeline
    profiles: ["pipeline", "run-once"]
    volumes:
      - ./data:/opt/project/data
      - ./models:/opt/project/models
      - ./reports:/opt/project/reports
    env_file:
      - path: .env
        required: false
    command: >
      bash -c "
      python scripts/make_replica_dataset.py || true &&
      python scripts/run_phase1.py --smoke &&
      python scripts/run_phase3.py --no-sensitivity
      "

  postgres:
    image: postgres:15-alpine
    container_name: mmm-postgres
    profiles: ["pipeline"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: mmm-airflow:latest
    container_name: mmm-airflow-init
    profiles: ["pipeline"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MMM_PROJECT_ROOT: /opt/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/project
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname Admin --lastname User --role Admin --email admin@example.com
      || true
      "

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: mmm-airflow:latest
    container_name: mmm-airflow-web
    profiles: ["pipeline"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MMM_PROJECT_ROOT: /opt/project
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/project
    command: airflow webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: mmm-airflow:latest
    container_name: mmm-airflow-scheduler
    profiles: ["pipeline"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MMM_PROJECT_ROOT: /opt/project
      MMM_SMOKE: "1"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/project
    command: airflow scheduler

volumes:
  postgres-data:
